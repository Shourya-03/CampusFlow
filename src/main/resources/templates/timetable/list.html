<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timetable — Student Management System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="app-body">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container-fluid px-4 py-4">
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show"><i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold mb-0"><i class="bi bi-clock-fill me-2 text-primary"></i>Weekly Timetable</h4>
            <div class="d-flex gap-2">
                <!-- Course filter (ADMIN/TEACHER only) -->
                <form th:action="@{/timetable}" method="get" class="d-flex gap-2" sec:authorize="hasAnyRole('ADMIN','TEACHER')">
                    <select name="course" class="form-select form-select-sm" style="width: 250px;">
                        <option value="">All Courses</option>
                        <option th:each="c : ${courses}" th:value="${c}" th:text="${c}" th:selected="${c == selectedCourse}"></option>
                    </select>
                    <button type="submit" class="btn btn-sm btn-primary">Filter</button>
                </form>
                <a th:href="@{/timetable/add}" class="btn btn-primary btn-sm" sec:authorize="hasRole('ADMIN')"><i class="bi bi-plus-circle me-1"></i>Add Entry</a>
            </div>
        </div>

        <!-- Show selected course info for students -->
        <p th:if="${selectedCourse != null}" class="text-muted mb-3">Showing timetable for: <strong th:text="${selectedCourse}"></strong></p>

        <!-- Timetable Grid -->
        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-bordered align-middle mb-0 timetable-grid">
                        <thead>
                            <tr>
                                <th class="text-center" th:each="day : ${days}" th:text="${day}"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td th:each="day : ${days}" class="align-top p-2">
                                    <div th:each="entry : ${entries}" th:if="${entry.dayOfWeek.name() == day.name()}" class="timetable-slot mb-2 p-2 rounded">
                                        <div class="fw-bold small" th:text="${entry.subject}"></div>
                                        <div class="text-muted" style="font-size: 0.75rem;">
                                            <span th:text="${#temporals.format(entry.startTime, 'HH:mm')}"></span> - <span th:text="${#temporals.format(entry.endTime, 'HH:mm')}"></span>
                                        </div>
                                        <div class="text-muted" style="font-size: 0.7rem;" th:if="${entry.roomNumber != null}">
                                            <i class="bi bi-geo-alt"></i> <span th:text="${entry.roomNumber}"></span>
                                        </div>
                                        <div class="text-muted" style="font-size: 0.7rem;" th:if="${entry.teacherName != null}">
                                            <i class="bi bi-person"></i> <span th:text="${entry.teacherName}"></span>
                                        </div>
                                        <form th:action="@{/timetable/delete/{id}(id=${entry.timetableId})}" method="post" class="d-inline" sec:authorize="hasRole('ADMIN')">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                            <button type="submit" class="btn btn-link btn-sm text-danger p-0" style="font-size:0.7rem;" onclick="return confirm('Delete this entry?')"><i class="bi bi-x-circle"></i></button>
                                        </form>
                                    </div>
                                    <!-- Empty state for this day -->
                                    <div th:if="${#lists.isEmpty(entries)}" class="text-muted small text-center py-2">—</div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <footer class="text-center py-3 text-muted small border-top mt-4">© 2025 Student Management System</footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
