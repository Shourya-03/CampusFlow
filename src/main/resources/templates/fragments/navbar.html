<!-- Shared navbar fragment — included on every page via th:replace -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark app-navbar"
     xmlns:th="http://www.thymeleaf.org"
     xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <div class="container-fluid px-4">
        <!-- Brand -->
        <a class="navbar-brand fw-bold" th:href="@{/dashboard}" sec:authorize="hasAnyRole('ADMIN','TEACHER')">
            <i class="bi bi-mortarboard-fill me-2"></i>SMS Portal
        </a>
        <a class="navbar-brand fw-bold" th:href="@{/student-dashboard}" sec:authorize="hasRole('STUDENT')">
            <i class="bi bi-mortarboard-fill me-2"></i>SMS Portal
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <!-- ADMIN Navigation -->
            <ul class="navbar-nav me-auto" sec:authorize="hasRole('ADMIN')">
                <li class="nav-item"><a class="nav-link" th:href="@{/dashboard}"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/students}"><i class="bi bi-people me-1"></i>Students</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/attendance}"><i class="bi bi-calendar-check me-1"></i>Attendance</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/marks}"><i class="bi bi-journal-text me-1"></i>Marks</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/fees}"><i class="bi bi-currency-rupee me-1"></i>Fees</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/notices}"><i class="bi bi-megaphone me-1"></i>Notices</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/timetable}"><i class="bi bi-clock me-1"></i>Timetable</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/reports}"><i class="bi bi-graph-up me-1"></i>Reports</a></li>
            </ul>

            <!-- TEACHER Navigation -->
            <ul class="navbar-nav me-auto" sec:authorize="hasRole('TEACHER')">
                <li class="nav-item"><a class="nav-link" th:href="@{/dashboard}"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/students}"><i class="bi bi-people me-1"></i>Students</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/attendance}"><i class="bi bi-calendar-check me-1"></i>Attendance</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/marks}"><i class="bi bi-journal-text me-1"></i>Marks</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/notices}"><i class="bi bi-megaphone me-1"></i>Notices</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/timetable}"><i class="bi bi-clock me-1"></i>Timetable</a></li>
            </ul>

            <!-- STUDENT Navigation -->
            <ul class="navbar-nav me-auto" sec:authorize="hasRole('STUDENT')">
                <li class="nav-item"><a class="nav-link" th:href="@{/student-dashboard}"><i class="bi bi-house me-1"></i>Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/notices}"><i class="bi bi-megaphone me-1"></i>Notices</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/timetable}"><i class="bi bi-clock me-1"></i>Timetable</a></li>
            </ul>

            <!-- User Info + Logout -->
            <ul class="navbar-nav ms-auto align-items-center gap-2">
                <li class="nav-item">
                    <span class="navbar-text me-2">
                        <i class="bi bi-person-circle me-1"></i>
                        <span th:text="${username}" class="fw-semibold"></span>
                        <span class="badge role-badge ms-1" th:text="${role}"></span>
                    </span>
                </li>
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="btn btn-outline-light btn-sm">
                            <i class="bi bi-box-arrow-right me-1"></i>Logout
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>
