<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance — Student Management System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="app-body">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container-fluid px-4 py-4">
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show"><i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold mb-0"><i class="bi bi-calendar-check-fill me-2 text-primary"></i>Attendance Records</h4>
            <a th:href="@{/attendance/mark}" class="btn btn-primary" sec:authorize="hasAnyRole('ADMIN','TEACHER')"><i class="bi bi-plus-circle me-1"></i>Mark Attendance</a>
        </div>
        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <table class="table table-striped table-hover table-bordered align-middle mb-0">
                    <thead><tr><th>#</th><th>Student</th><th>Subject</th><th>Date</th><th>Status</th></tr></thead>
                    <tbody>
                        <tr th:each="a, stat : ${attendanceList}">
                            <td th:text="${stat.index + 1}"></td>
                            <td th:text="${a.student != null ? a.student.name : 'Unknown'}"></td>
                            <td th:text="${a.subject}"></td>
                            <td th:text="${#temporals.format(a.date, 'dd MMM yyyy')}"></td>
                            <td><span class="badge" th:classappend="${a.status.name() == 'PRESENT'} ? 'bg-success' : 'bg-danger'" th:text="${a.status}"></span></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(attendanceList)}"><td colspan="5" class="text-center text-muted py-4">No attendance records found.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <footer class="text-center py-3 text-muted small border-top mt-4">© 2025 Student Management System</footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
