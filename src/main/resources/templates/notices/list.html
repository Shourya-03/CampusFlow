<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notices — Student Management System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="app-body">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container-fluid px-4 py-4">
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show"><i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold mb-0"><i class="bi bi-megaphone-fill me-2 text-info"></i>Notice Board</h4>
            <a th:href="@{/notices/add}" class="btn btn-info text-white" sec:authorize="hasRole('ADMIN')"><i class="bi bi-plus-circle me-1"></i>Post Notice</a>
        </div>
        <div th:if="${#lists.isEmpty(notices)}" class="text-center text-muted py-5"><i class="bi bi-megaphone fs-1 d-block mb-2"></i>No notices available.</div>
        <div th:each="notice : ${notices}" class="card border-0 shadow-sm mb-3">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <h5 class="fw-bold mb-1" th:text="${notice.title}"></h5>
                        <p class="mb-2" th:text="${notice.content}"></p>
                        <small class="text-muted">
                            <i class="bi bi-person me-1"></i><span th:text="${notice.postedBy}"></span> ·
                            <i class="bi bi-clock me-1"></i><span th:text="${#temporals.format(notice.postedAt, 'dd MMM yyyy HH:mm')}"></span> ·
                            <span class="badge bg-light text-dark border" th:text="'Visible to: ' + ${notice.visibleTo}"></span>
                        </small>
                    </div>
                    <div sec:authorize="hasRole('ADMIN')">
                        <button type="button" class="btn btn-sm btn-outline-danger" data-bs-toggle="modal" th:data-bs-target="'#deleteNotice' + ${notice.noticeId}"><i class="bi bi-trash"></i></button>
                        <div class="modal fade" th:id="'deleteNotice' + ${notice.noticeId}" tabindex="-1">
                            <div class="modal-dialog"><div class="modal-content">
                                <div class="modal-header"><h5 class="modal-title">Delete Notice</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                                <div class="modal-body">Delete "<strong th:text="${notice.title}"></strong>"?</div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                                    <form th:action="@{/notices/delete/{id}(id=${notice.noticeId})}" method="post" class="d-inline">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                        <button type="submit" class="btn btn-danger">Delete</button>
                                    </form>
                                </div>
                            </div></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <footer class="text-center py-3 text-muted small border-top mt-4">© 2025 Student Management System</footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
