<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fee Summary — Student Management System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="app-body">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container-fluid px-4 py-4">
        <h4 class="fw-bold mb-2"><i class="bi bi-currency-rupee me-2 text-warning"></i>Fee Summary</h4>
        <p class="text-muted mb-4">Student: <strong th:text="${student.name}"></strong> (<span th:text="${student.rollNo}"></span>)</p>
        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <table class="table table-striped table-hover table-bordered align-middle mb-0">
                    <thead><tr><th>Description</th><th>Amount</th><th>Paid</th><th>Balance</th><th>Due Date</th><th>Status</th></tr></thead>
                    <tbody>
                        <tr th:each="f : ${feeList}">
                            <td th:text="${f.description}"></td>
                            <td>₹<span th:text="${f.amount}"></span></td>
                            <td>₹<span th:text="${f.paidAmount}"></span></td>
                            <td>₹<span th:text="${f.balance}"></span></td>
                            <td th:text="${f.dueDate != null ? #temporals.format(f.dueDate, 'dd MMM yyyy') : 'N/A'}"></td>
                            <td>
                                <span th:if="${f.status.name() == 'PAID'}" class="badge bg-success">PAID</span>
                                <span th:if="${f.status.name() == 'PARTIALLY_PAID'}" class="badge bg-warning text-dark">PARTIALLY PAID</span>
                                <span th:if="${f.status.name() == 'UNPAID'}" class="badge bg-danger">UNPAID</span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(feeList)}"><td colspan="6" class="text-center text-muted py-4">No fee records.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <footer class="text-center py-3 text-muted small border-top mt-4">© 2025 Student Management System</footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
