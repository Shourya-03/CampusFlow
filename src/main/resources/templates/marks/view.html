<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result Card — Student Management System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="app-body">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container-fluid px-4 py-4">
        <h4 class="fw-bold mb-2"><i class="bi bi-journal-text me-2 text-success"></i>Result Card</h4>
        <p class="text-muted mb-1">Student: <strong th:text="${student.name}"></strong> (<span th:text="${student.rollNo}"></span>)</p>
        <p class="text-muted mb-4">
            Overall Average: <strong th:text="${averagePercentage + '%'}"></strong> ·
            Overall Grade: <span class="badge fs-6" th:classappend="${overallGrade == 'A'} ? 'bg-success' : (${overallGrade == 'B'} ? 'bg-primary' : (${overallGrade == 'C'} ? 'bg-warning text-dark' : (${overallGrade == 'D'} ? 'bg-orange' : 'bg-danger')))" th:text="${overallGrade}"></span>
        </p>
        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <table class="table table-striped table-hover table-bordered align-middle mb-0">
                    <thead><tr><th>Subject</th><th>Marks</th><th>Percentage</th><th>Grade</th><th>Exam Type</th></tr></thead>
                    <tbody>
                        <tr th:each="m : ${marksList}">
                            <td th:text="${m.subject}"></td>
                            <td><span th:text="${m.marksObtained}"></span> / <span th:text="${m.maxMarks}"></span></td>
                            <td th:text="${#numbers.formatDecimal(m.percentage, 1, 1) + '%'}"></td>
                            <td><span class="badge" th:classappend="${m.grade == 'A'} ? 'bg-success' : (${m.grade == 'B'} ? 'bg-primary' : (${m.grade == 'C'} ? 'bg-warning text-dark' : (${m.grade == 'D'} ? 'bg-orange' : 'bg-danger')))" th:text="${m.grade}"></span></td>
                            <td th:text="${m.examType}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(marksList)}"><td colspan="5" class="text-center text-muted py-4">No marks records.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <footer class="text-center py-3 text-muted small border-top mt-4">© 2025 Student Management System</footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
