<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student — Student Management System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="app-body">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container-fluid px-4 py-4">
        <h4 class="fw-bold mb-4"><i class="bi bi-person-plus-fill me-2 text-primary"></i>Add New Student</h4>
        <div class="card border-0 shadow-sm">
            <div class="card-body">
                <form th:action="@{/students/add}" th:object="${student}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Name *</label>
                            <input type="text" class="form-control" th:field="*{name}" required>
                            <div th:if="${#fields.hasErrors('name')}" class="text-danger small" th:errors="*{name}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Roll Number *</label>
                            <input type="text" class="form-control" th:field="*{rollNo}" required>
                            <div th:if="${#fields.hasErrors('rollNo')}" class="text-danger small" th:errors="*{rollNo}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Course *</label>
                            <input type="text" class="form-control" th:field="*{course}" required>
                            <div th:if="${#fields.hasErrors('course')}" class="text-danger small" th:errors="*{course}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Date of Birth</label>
                            <input type="date" class="form-control" th:field="*{dob}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Contact</label>
                            <input type="text" class="form-control" th:field="*{contact}" maxlength="15">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Email</label>
                            <input type="email" class="form-control" th:field="*{email}">
                        </div>
                        <div class="col-md-12">
                            <label class="form-label fw-semibold">Address</label>
                            <textarea class="form-control" th:field="*{address}" rows="2"></textarea>
                        </div>
                        <div class="col-md-12">
                            <label class="form-label fw-semibold">Bio</label>
                            <textarea class="form-control" th:field="*{bio}" rows="2"></textarea>
                        </div>
                    </div>
                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle me-1"></i>Save Student</button>
                        <a th:href="@{/students}" class="btn btn-outline-secondary ms-2">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <footer class="text-center py-3 text-muted small border-top mt-4">© 2025 Student Management System</footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
