<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marks — Student Management System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="app-body">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container-fluid px-4 py-4">
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show"><i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show"><i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold mb-0"><i class="bi bi-journal-text me-2 text-success"></i>Marks Records</h4>
            <a th:href="@{/marks/add}" class="btn btn-success" sec:authorize="hasAnyRole('ADMIN','TEACHER')"><i class="bi bi-plus-circle me-1"></i>Add Marks</a>
        </div>
        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <table class="table table-striped table-hover table-bordered align-middle mb-0">
                    <thead><tr><th>#</th><th>Student</th><th>Subject</th><th>Marks</th><th>Percentage</th><th>Grade</th><th>Exam</th></tr></thead>
                    <tbody>
                        <tr th:each="m, stat : ${marksList}">
                            <td th:text="${stat.index + 1}"></td>
                            <td th:text="${m.student != null ? m.student.name : 'Unknown'}"></td>
                            <td th:text="${m.subject}"></td>
                            <td><span th:text="${m.marksObtained}"></span> / <span th:text="${m.maxMarks}"></span></td>
                            <td th:text="${#numbers.formatDecimal(m.percentage, 1, 1) + '%'}"></td>
                            <td><span class="badge" th:classappend="${m.grade == 'A'} ? 'bg-success' : (${m.grade == 'B'} ? 'bg-primary' : (${m.grade == 'C'} ? 'bg-warning text-dark' : (${m.grade == 'D'} ? 'bg-orange' : 'bg-danger')))" th:text="${m.grade}"></span></td>
                            <td th:text="${m.examType}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(marksList)}"><td colspan="7" class="text-center text-muted py-4">No marks records found.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <footer class="text-center py-3 text-muted small border-top mt-4">© 2025 Student Management System</footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
