<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Summary — Student Management System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="app-body">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container-fluid px-4 py-4">
        <h4 class="fw-bold mb-2"><i class="bi bi-calendar-check-fill me-2 text-primary"></i>Attendance Summary</h4>
        <p class="text-muted mb-4">Student: <strong th:text="${student.name}"></strong> (<span th:text="${student.rollNo}"></span>) · Overall: <strong th:text="${overallPercentage + '%'}" th:classappend="${overallPercentage < 75} ? 'text-danger' : 'text-success'"></strong></p>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <table class="table table-striped table-hover table-bordered align-middle mb-0">
                    <thead><tr><th>Subject</th><th>Total</th><th>Present</th><th>Absent</th><th>Percentage</th></tr></thead>
                    <tbody>
                        <tr th:each="s : ${summary}">
                            <td th:text="${s['subject']}"></td>
                            <td th:text="${s['total']}"></td>
                            <td th:text="${s['present']}"></td>
                            <td th:text="${s['absent']}"></td>
                            <td>
                                <span th:text="${s['percentage'] + '%'}" th:classappend="${s['percentage'] < 75} ? 'text-danger fw-bold' : 'text-success fw-bold'"></span>
                                <i th:if="${s['percentage'] < 75}" class="bi bi-exclamation-triangle-fill text-danger ms-1"></i>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(summary)}"><td colspan="5" class="text-center text-muted py-4">No attendance records.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <footer class="text-center py-3 text-muted small border-top mt-4">© 2025 Student Management System</footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
