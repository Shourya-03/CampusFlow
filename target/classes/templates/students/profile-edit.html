<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit My Profile — Student Management System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="app-body">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container-fluid px-4 py-4">
        <div class="d-flex align-items-center gap-3 mb-4">
            <a th:href="@{/students/profile/{id}(id=${student.studentId})}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i></a>
            <div>
                <h4 class="fw-bold mb-0"><i class="bi bi-pencil-square me-2 text-primary"></i>Edit My Profile</h4>
                <p class="text-muted mb-0 small">Update your personal information</p>
            </div>
        </div>
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <form th:action="@{/students/profile/{id}/edit(id=${student.studentId})}" th:object="${student}" method="post" enctype="multipart/form-data">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <!-- Read-only info banner -->
                    <div class="alert alert-light border d-flex align-items-center gap-3 mb-4">
                        <div class="avatar-circle-lg" style="width:60px;height:60px;font-size:1.5rem;" th:if="${student.photoUrl == null}">
                            <span th:text="${#strings.substring(student.name, 0, 1).toUpperCase()}"></span>
                        </div>
                        <img th:if="${student.photoUrl != null}" th:src="@{'/uploads/' + ${student.photoUrl}}" class="rounded-circle" style="width:60px;height:60px;object-fit:cover;" alt="Photo">
                        <div>
                            <h5 class="fw-bold mb-0" th:text="${student.name}"></h5>
                            <span class="text-muted small" th:text="${student.rollNo + ' · ' + student.course}"></span>
                        </div>
                    </div>

                    <h6 class="fw-semibold text-muted text-uppercase small mb-3"><i class="bi bi-person-lines-fill me-2"></i>Editable Information</h6>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Phone Number</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-telephone text-muted"></i></span>
                                <input type="text" class="form-control" th:field="*{contact}" maxlength="15" placeholder="Your phone number">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-envelope text-muted"></i></span>
                                <input type="email" class="form-control" th:field="*{email}" placeholder="Your email address">
                            </div>
                        </div>
                        <div class="col-md-12">
                            <label class="form-label fw-semibold">Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-geo-alt text-muted"></i></span>
                                <textarea class="form-control" th:field="*{address}" rows="2" placeholder="Your address"></textarea>
                            </div>
                        </div>
                        <div class="col-md-12">
                            <label class="form-label fw-semibold">Bio</label>
                            <textarea class="form-control" th:field="*{bio}" rows="3" placeholder="Tell us about yourself..."></textarea>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Profile Photo</label>
                            <input type="file" name="photo" class="form-control" accept="image/*">
                            <div th:if="${student.photoUrl != null}" class="mt-2">
                                <small class="text-muted"><i class="bi bi-image me-1"></i>Current: <span th:text="${student.photoUrl}"></span></small>
                            </div>
                        </div>
                    </div>
                    <hr class="my-4">
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check-circle me-1"></i>Save Changes</button>
                        <a th:href="@{/students/profile/{id}(id=${student.studentId})}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <footer class="text-center py-3 text-muted small border-top mt-4">© 2025 Student Management System</footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
