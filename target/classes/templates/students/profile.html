<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile — Student Management System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="app-body">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container-fluid px-4 py-4">
        <!-- Flash -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show"><i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>

        <div class="row g-4">
            <!-- Profile Card -->
            <div class="col-md-4">
                <div class="card border-0 shadow-sm text-center">
                    <div class="card-body py-5">
                        <!-- Photo or default avatar -->
                        <div th:if="${student.photoUrl != null}" class="mb-3">
                            <img th:src="@{'/uploads/' + ${student.photoUrl}}" alt="Profile" class="profile-photo rounded-circle" style="width: 120px; height: 120px; object-fit: cover;">
                        </div>
                        <div th:unless="${student.photoUrl != null}" class="mb-3">
                            <div class="avatar-circle-lg mx-auto">
                                <span th:text="${#strings.substring(student.name, 0, 1).toUpperCase()}"></span>
                            </div>
                        </div>
                        <h4 class="fw-bold mb-1" th:text="${student.name}"></h4>
                        <span class="badge bg-light text-dark border mb-2" th:text="${student.rollNo}"></span>
                        <p class="text-muted mb-3" th:text="${student.course}"></p>
                        <p th:if="${student.bio != null}" class="text-muted small fst-italic" th:text="${student.bio}"></p>
                        <a th:href="@{/students/profile/{id}/edit(id=${student.studentId})}" class="btn btn-outline-primary btn-sm" sec:authorize="hasRole('ADMIN')"><i class="bi bi-pencil me-1"></i>Edit Profile</a>
                    </div>
                </div>

                <!-- Contact Info -->
                <div class="card border-0 shadow-sm mt-3">
                    <div class="card-header bg-transparent fw-semibold"><i class="bi bi-info-circle me-2"></i>Contact Info</div>
                    <div class="card-body">
                        <p class="small mb-2" th:if="${student.dob != null}"><i class="bi bi-calendar3 me-2 text-muted"></i><span th:text="${#temporals.format(student.dob, 'dd MMM yyyy')}"></span></p>
                        <p class="small mb-2" th:if="${student.contact != null}"><i class="bi bi-telephone me-2 text-muted"></i><span th:text="${student.contact}"></span></p>
                        <p class="small mb-2" th:if="${student.email != null}"><i class="bi bi-envelope me-2 text-muted"></i><span th:text="${student.email}"></span></p>
                        <p class="small mb-0" th:if="${student.address != null}"><i class="bi bi-geo-alt me-2 text-muted"></i><span th:text="${student.address}"></span></p>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <!-- Summary Cards -->
                <div class="row g-3 mb-4">
                    <div class="col-md-4">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body text-center">
                                <i class="bi bi-calendar-check text-primary fs-3 d-block mb-2"></i>
                                <small class="text-muted">Attendance</small>
                                <h4 class="fw-bold" th:classappend="${attendancePercentage < 75} ? 'text-danger' : 'text-success'"><span th:text="${attendancePercentage}">0</span>%</h4>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body text-center">
                                <i class="bi bi-journal-check text-success fs-3 d-block mb-2"></i>
                                <small class="text-muted">Marks Average</small>
                                <h4 class="fw-bold"><span th:text="${marksAverage}">0</span>%</h4>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body text-center">
                                <i class="bi bi-currency-rupee text-warning fs-3 d-block mb-2"></i>
                                <small class="text-muted">Fee Status</small>
                                <h4 class="fw-bold">
                                    <span th:if="${feeStatus == 'PAID'}" class="badge bg-success">PAID</span>
                                    <span th:if="${feeStatus == 'PARTIALLY_PAID'}" class="badge bg-warning text-dark">PARTIAL</span>
                                    <span th:if="${feeStatus == 'UNPAID'}" class="badge bg-danger">UNPAID</span>
                                    <span th:if="${feeStatus == 'N/A'}" class="badge bg-secondary">N/A</span>
                                </h4>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Recent Attendance -->
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-header bg-transparent fw-semibold"><i class="bi bi-calendar-check me-2 text-primary"></i>Recent Attendance</div>
                    <div class="card-body p-0">
                        <table class="table table-striped table-hover mb-0">
                            <thead><tr><th>Date</th><th>Subject</th><th>Status</th></tr></thead>
                            <tbody>
                                <tr th:each="a : ${recentAttendance}">
                                    <td th:text="${#temporals.format(a.date, 'dd MMM yyyy')}"></td>
                                    <td th:text="${a.subject}"></td>
                                    <td>
                                        <span th:if="${a.status.name() == 'PRESENT'}" class="badge bg-success">PRESENT</span>
                                        <span th:if="${a.status.name() == 'ABSENT'}" class="badge bg-danger">ABSENT</span>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(recentAttendance)}"><td colspan="3" class="text-center text-muted py-3">No attendance records.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Recent Marks -->
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-transparent fw-semibold"><i class="bi bi-journal-text me-2 text-success"></i>Marks</div>
                    <div class="card-body p-0">
                        <table class="table table-striped table-hover mb-0">
                            <thead><tr><th>Subject</th><th>Marks</th><th>Percentage</th><th>Grade</th></tr></thead>
                            <tbody>
                                <tr th:each="m : ${recentMarks}">
                                    <td th:text="${m.subject}"></td>
                                    <td><span th:text="${m.marksObtained}"></span> / <span th:text="${m.maxMarks}"></span></td>
                                    <td th:text="${#numbers.formatDecimal(m.percentage, 1, 1) + '%'}"></td>
                                    <td>
                                        <span class="badge" th:classappend="${m.grade == 'A'} ? 'bg-success' : (${m.grade == 'B'} ? 'bg-primary' : (${m.grade == 'C'} ? 'bg-warning text-dark' : (${m.grade == 'D'} ? 'bg-orange' : 'bg-danger')))" th:text="${m.grade}"></span>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(recentMarks)}"><td colspan="4" class="text-center text-muted py-3">No marks records.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <footer class="text-center py-3 text-muted small border-top mt-4">© 2025 Student Management System</footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
